services:
  ctf-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/sudo-baoz/ctf-dashboard:latest
    container_name: 6h4t9ptpr0-dashboard
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      - NODE_ENV=production
      - PORT=7000
    networks:
      - ctf-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7000/api/intel', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  ctf-network:
    driver: bridge
